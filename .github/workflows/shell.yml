name: shell
# A macOS runner joined to the relay as a shell target, until ~/stop exists or time runs out.
on:
  workflow_dispatch:
    inputs:
      os:
        description: runner label
        default: macos-26
      minutes:
        description: minutes to stay up
        default: "345"
      id:
        description: relay target id
        default: mac-metal
jobs:
  shell:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 355
    steps:
      - name: relay target
        env:
          RELAYFS_TOKEN: ${{ secrets.RELAYFS_TOKEN }}
          RELAYFS_URL: ${{ secrets.RELAYFS_URL }}
        run: |
          curl -fsSL -o "$HOME/relayfs" https://github.com/KumarDev7/relayfs/releases/download/v0.5.1/relayfs-aarch64-apple-darwin
          chmod +x "$HOME/relayfs"
          mkdir -p "$HOME/work"
          file "$HOME/relayfs"; "$HOME/relayfs" --version
          echo "relay url length ${#RELAYFS_URL}, token length ${#RELAYFS_TOKEN}"
          (cd "$HOME/work" && nohup "$HOME/relayfs" --mode target --base-url "$RELAYFS_URL" --token "$RELAYFS_TOKEN" --id "${{ inputs.id }}" --name "${{ inputs.os }}" > "$HOME/relay.log" 2>&1 &)
          end=$(( $(date +%s) + ${{ inputs.minutes }} * 60 ))
          shown=0
          while [ ! -f "$HOME/stop" ] && [ "$(date +%s)" -lt "$end" ]; do
            sleep 10
            # new relay log lines into the job log
            n=$(wc -l < "$HOME/relay.log"); if [ "$n" -gt "$shown" ]; then tail -n +$((shown + 1)) "$HOME/relay.log" | head -50; shown=$n; fi
            pgrep -f "relayfs --mode target" > /dev/null || { echo "relay target exited"; exit 1; }
          done
          echo "stopping"
